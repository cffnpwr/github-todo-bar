name: Setup Nix
description: Install Nix with shared substituters and enable Magic Nix Cache.
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/determinate-nix-action@7c4cc317e802185875512bfcb68259257279d767 # v3.19.1
      with:
        extra-conf: |
          sandbox = false
          ssl-cert-file = /etc/ssl/certs/ca-certificates.crt
          extra-substituters = https://nix-cache.cffnpwr.dev https://fenix.cachix.org
          extra-trusted-public-keys = cffnpwr-nixpkgs-extras:dmp2DUGwdqawLCPOsOcRxU/NpCO/qA1jha/8rmoSzvA= fenix.cachix.org-1:ecJhr+RdYEdcVgUkjruiYhjbBloIEGov7bos90cZi0Q=

    - name: Magic Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
