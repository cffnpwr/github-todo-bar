name: commitlint
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Run commitlint
    uses: cffnpwr/actions/.github/workflows/commitlint.yaml@6f0c7567a6782756b814dcc338c1bdaa7ebc46e4 # cffnpwr/actions#15
    permissions:
      contents: read
      actions: read
