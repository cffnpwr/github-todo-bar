[package]
name = "github-todo-bar"
version = "0.1.0"
edition = "2024"

[dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSResponder", "NSControl", "NSButton", "NSView"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
