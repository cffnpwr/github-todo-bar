[package]
name = "github-todo-bar"
version = "0.1.0"
edition = "2024"

[dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSResponder", "NSControl", "NSButton", "NSView"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
reqwest = { version = "0.13.3", default-features = false, features = ["charset", "http2", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
const_format = "0.2.36"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
